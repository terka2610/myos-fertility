<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMP-0001 simulated chat</title>
<style>
  :root {
    color-scheme: light;
    --background: oklch(0.985 0.009 62.6);
    --foreground: oklch(0.213 0.050 355.2);
    --card: oklch(1 0 89.9);
    --primary: oklch(0.213 0.050 355.2);
    --primary-foreground: oklch(0.985 0.009 62.6);
    --pink: oklch(0.802 0.082 349.9);
    --pink-soft: oklch(0.937 0.028 345.9);
    --gold-soft: oklch(0.955 0.045 91.7);
    --muted-foreground: oklch(0.426 0.036 348.4);
    --border: oklch(0.926 0.017 349.5);
    --input: oklch(0.887 0.027 347.2);
    --accent: oklch(0.511 0.141 354.6);
    --warning-foreground: oklch(0.357 0.035 346.2);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--background); color: var(--foreground); }
  header { display: flex; justify-content: space-between; gap: 1rem; align-items: center; padding: 0.9rem 1.1rem; background: var(--primary); color: var(--primary-foreground); }
  header p { margin: 0.15rem 0 0; color: var(--pink); font-size: 0.92rem; }
  header button, .record button, form button { border: 0; border-radius: 999px; padding: 0.45rem 0.8rem; background: var(--primary); color: var(--primary-foreground); font: inherit; cursor: pointer; }
  header button { background: var(--pink-soft); color: var(--foreground); }
  main { display: grid; grid-template-columns: 20rem 1fr; min-height: calc(100vh - 4.6rem); }
  .record, .chat { padding: 1rem; }
  .record { background: var(--background); border-right: 1px solid var(--border); }
  .record h2, .chat h2 { margin: 0 0 0.35rem; font-size: 1rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0.75rem 0.85rem; margin: 0 0 0.7rem; }
  .card p { margin: 0.2rem 0; }
  .muted { color: var(--muted-foreground); }
  .stale { color: var(--warning-foreground); font-weight: 650; }
  .route-panel { padding-bottom: 0.55rem; }
  .route-map { display: block; width: 100%; height: 9rem; margin-top: 0.45rem; border-radius: 8px; background: var(--gold-soft); }
  .route-line { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .route-dot { fill: var(--card); stroke: var(--accent); stroke-width: 2.5; }
  .route-current { fill: var(--pink); stroke: var(--card); stroke-width: 2.5; }
  .route-label { fill: var(--muted-foreground); font: 11px system-ui, sans-serif; }
  .route-empty { min-height: 4rem; display: grid; place-items: center; text-align: center; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--primary); color: var(--primary-foreground); border-radius: 8px; padding: 0.6rem; font-size: 0.78rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .tabs { display: flex; gap: 0.4rem; margin-bottom: 0.7rem; }
  .tabs button { border: 1px solid var(--border); background: var(--card); color: var(--foreground); border-radius: 999px; padding: 0.4rem 0.7rem; font: inherit; cursor: pointer; }
  .tabs button.on { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  .thread { background: var(--card); border: 1px solid var(--border); border-radius: 14px; min-height: 24rem; padding: 0.8rem; display: flex; flex-direction: column; gap: 0.45rem; }
  .bubble { max-width: 36rem; padding: 0.55rem 0.7rem; border-radius: 12px; }
  .out { background: var(--pink-soft); }
  .in { background: var(--gold-soft); align-self: flex-end; }
  form { display: flex; gap: 0.45rem; margin-top: 0.7rem; }
  input { flex: 1; border: 1px solid var(--input); border-radius: 999px; padding: 0.55rem 0.8rem; font: inherit; color: var(--foreground); background: var(--card); }
  input::placeholder { color: var(--muted-foreground); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } .record { border-right: 0; border-bottom: 1px solid var(--border); } }
</style>
</head>
<body>
<header>
  <div>
    <strong>SMP-0001 chats</strong>
    <p>Admin is in every chat. One announcements group, and a chat for each pair.</p>
  </div>
</header>
<main>
  <section class="record">
    <div class="card">
      <h2>Record</h2>
      <p id="doc"></p>
      <p id="schedule"></p>
      <p id="hint" class="muted"></p>
      <p id="phones" class="muted"></p>
    </div>
    <div class="card">
      <h2>Synthetic GPS demo feed</h2>
      <p id="gps">Connecting to the GPS monitor…</p>
      <p id="gps-updated" class="muted"></p>
      <p class="muted">Demo courier data only. This feed is not linked to patient or sample records.</p>
    </div>
    <div class="card route-panel">
      <h2>Recent courier route</h2>
      <p id="route-status" class="muted">Loading route…</p>
      <div id="route-view"></div>
    </div>
    <div class="actions" id="actions"></div>
  </section>
  <section class="chat">
    <div class="tabs" id="tabs"></div>
    <div class="thread" id="thread"></div>
    <form id="composer">
      <input id="text" autocomplete="off" placeholder="Reply as this party">
      <button type="submit">Send</button>
    </form>
  </section>
</main>
<script>
const accounts = { admin: "Admin", centre: "Fertility clinic", transport: "Cryoport", storage: "CryoNext storage", patient: "Patient" };
const threadLabels = {
  group: "Announcements",
  "clinic-transport": "Clinic and Cryoport",
  "clinic-storage": "Clinic and CryoNext",
  "transport-storage": "Cryoport and CryoNext"
};
const actionLabels = {
  upload: "Upload document",
  approve: "Approve document",
  record_pickup: "Record pickup",
  gps_stop: "Pause scenario tracking",
  record_receipt: "Record receipt",
  record_placement: "Record placement"
};
let state = null;
let role = "admin";
let thread = "group";

function esc(value) {
  return String(value).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

function drawRoute(feed, gpsStatus) {
  const status = document.getElementById("route-status");
  const view = document.getElementById("route-view");
  const points = feed && Array.isArray(feed.trail) ? feed.trail : [];
  const validPoints = points.filter((point) =>
    point && Number.isFinite(Number(point.latitude)) && Number.isFinite(Number(point.longitude))
    && Number(point.latitude) >= -90 && Number(point.latitude) <= 90
    && Number(point.longitude) >= -180 && Number(point.longitude) <= 180
  );
  const fix = feed && feed.last_fix;
  const stale = gpsStatus === "stale";
  if (!feed || !feed.connected) {
    status.textContent = "Route unavailable · GPS monitor is not connected.";
    status.className = "stale";
    view.innerHTML = '<div class="route-empty muted">No recent route is available.</div>';
    return;
  }
  if (!validPoints.length) {
    status.textContent = fix ? "Route unavailable · no trail points received." : "Route missing · waiting for the courier’s first GPS fix.";
    status.className = fix ? "muted" : "stale";
    view.innerHTML = '<div class="route-empty muted">No recent route is available.</div>';
    return;
  }
  status.textContent = (stale ? "Stale route" : "Recent route") + " · " + validPoints.length + " GPS " + (validPoints.length === 1 ? "point" : "points");
  status.className = stale ? "stale" : "muted";

  const width = 320, height = 140, padX = 24, padY = 24;
  const lats = validPoints.map((point) => Number(point.latitude));
  const lons = validPoints.map((point) => Number(point.longitude));
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const minLon = Math.min(...lons), maxLon = Math.max(...lons);
  const spanLat = Math.max(maxLat - minLat, 0.0001);
  const spanLon = Math.max(maxLon - minLon, 0.0001);
  const coords = validPoints.map((point) => ({
    x: padX + ((Number(point.longitude) - minLon) / spanLon) * (width - padX * 2),
    y: height - padY - ((Number(point.latitude) - minLat) / spanLat) * (height - padY * 2)
  }));
  const path = coords.map((point, index) => (index ? "L" : "M") + point.x.toFixed(1) + " " + point.y.toFixed(1)).join(" ");
  const start = coords[0], current = coords[coords.length - 1];
  view.innerHTML = '<svg class="route-map" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Recent courier GPS route">'
    + '<path class="route-line" d="' + path + '"></path>'
    + '<circle class="route-dot" cx="' + start.x.toFixed(1) + '" cy="' + start.y.toFixed(1) + '" r="5"></circle>'
    + '<circle class="route-current" cx="' + current.x.toFixed(1) + '" cy="' + current.y.toFixed(1) + '" r="6"></circle>'
    + '<text class="route-label" x="8" y="16">START</text><text class="route-label" x="' + Math.min(width - 54, current.x + 8).toFixed(1) + '" y="' + Math.max(14, current.y - 8).toFixed(1) + '">LATEST</text>'
    + '</svg>';
}

async function load() {
  const response = await fetch("/api/chat");
  state = await response.json();
  draw();
}

function draw() {
  document.getElementById("doc").textContent = "Document: " + state.document.status.replaceAll("_", " ");
  const eta = state.schedule.eta_stale ? state.schedule.eta + " (stale)" : state.schedule.eta;
  document.getElementById("schedule").textContent = state.schedule.status + " · estimate " + eta;
  document.getElementById("hint").textContent = state.hint;
  const phones = state.whatsapp || {};
  document.getElementById("phones").textContent = phones.admin
    ? "WhatsApp · admin " + phones.admin + " · clinic " + phones.centre + " · storage " + phones.storage + " · Cryoport and patient still need a number"
    : "";
  const gps = document.getElementById("gps");
  const gpsUpdated = document.getElementById("gps-updated");
  const feed = state.gps_demo_feed;
  const fix = feed && feed.last_fix;
  if (!feed || !feed.connected) {
    gps.textContent = feed ? feed.message : "GPS monitor demo feed is unavailable.";
    gps.className = "stale";
    gpsUpdated.textContent = feed ? feed.message : "";
  } else if (!fix) {
    gps.textContent = feed.message;
    gps.className = "muted";
    gpsUpdated.textContent = feed.message;
  } else {
    const freshness = state.gps_status === "stale" ? "Stale location · " : "Current location · ";
    gps.textContent = freshness + feed.label + " (" + feed.asset_id + "): "
      + Number(fix.latitude).toFixed(5) + ", " + Number(fix.longitude).toFixed(5);
    gps.className = state.gps_status === "stale" ? "stale" : "";
    const details = [];
    if (fix.speed_kmh !== undefined) details.push(Number(fix.speed_kmh).toFixed(1) + " km/h");
    if (fix.accuracy_m !== undefined) details.push("±" + Math.round(fix.accuracy_m) + " m");
    gpsUpdated.textContent = (fix.recorded_at || "") + (details.length ? " · " + details.join(" · ") : "");
  }
  drawRoute(feed, state.gps_status);
  document.getElementById("actions").innerHTML = state.actions.map((action) =>
    '<button type="button" data-action="' + action + '">' + actionLabels[action] + "</button>"
  ).join("");
  const visible = Object.keys(threadLabels).filter((key) => state.thread_members[key].includes(role));
  if (!visible.includes(thread)) thread = visible[0];
  document.getElementById("tabs").innerHTML =
    Object.keys(accounts).map((key) =>
      '<button type="button" data-role="' + key + '" class="' + (key === role ? "on" : "") + '">' + accounts[key] + "</button>"
    ).join("") +
    visible.map((key) =>
      '<button type="button" data-thread="' + key + '" class="' + (key === thread ? "on" : "") + '">' + threadLabels[key] + "</button>"
    ).join("");
  const messages = state.threads[thread] || [];
  document.getElementById("thread").innerHTML = messages.length
    ? messages.map((item) => '<div class="bubble ' + item.direction + '">' + esc(item.body) + "</div>").join("")
    : '<p class="muted">No messages in this chat yet.</p>';
}

document.getElementById("tabs").addEventListener("click", (event) => {
  if (event.target.dataset.role) role = event.target.dataset.role;
  if (event.target.dataset.thread) thread = event.target.dataset.thread;
  draw();
});

document.getElementById("actions").addEventListener("click", async (event) => {
  const action = event.target.dataset.action;
  if (!action) return;
  await fetch("/api/chat/action", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action }) });
  await load();
});

document.getElementById("composer").addEventListener("submit", async (event) => {
  event.preventDefault();
  const input = document.getElementById("text");
  const text = input.value.trim();
  if (!text) return;
  const open = state.open_for[role];
  await fetch("/api/chat/message", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ role, text, thread, proposal_id: open ? open.id : null })
  });
  input.value = "";
  await load();
});

load();
setInterval(() => {
  if (!document.hidden) load().catch(() => {
    const gps = document.getElementById("gps");
    gps.textContent = "Could not refresh the GPS demo feed.";
    gps.className = "stale";
  });
}, 4000);
</script>
</body>
</html>
